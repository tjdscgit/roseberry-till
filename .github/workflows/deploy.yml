name: Deploy to GitHub Pages

# Builds the page and publishes it to https://tjdscgit.github.io/roseberry-till/ whenever main changes.
# The Zeller registry token comes from the ZELLER_NPM_TOKEN repository secret; it is never in the code
# and GitHub masks it in the logs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        env:
          ZELLER_NPM_TOKEN: ${{ secrets.ZELLER_NPM_TOKEN }}
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
